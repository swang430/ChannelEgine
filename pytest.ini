[pytest]
# Pytest configuration for TR 38.901 Statistical Validation Tests

markers =
    quick: Quick smoke tests with 50 samples (~10 seconds)
    standard: Standard validation tests with 200 samples (~1 minute)
    comprehensive: Comprehensive tests with 1000 samples (~5 minutes)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = tests
