[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-ota-simulator"
version = "0.1.0"
description = "A MIMO-OTA simulator application using the 3GPP TR 38.901 channel model."
authors = [
    {name = "Gemini AI"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "channel-model-38901"
]

[tool.setuptools]
packages = ["mimo_ota_simulator"]
